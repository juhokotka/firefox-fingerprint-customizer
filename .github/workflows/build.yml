name: Build & Release

# Trigger on version tags (e.g. v1.0.0, v1.0.0-beta).
# This conserves CI minutes — pushes to main don't trigger a build.
# To release, tag and push:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  # Allow manual runs from the Actions tab for testing.
  workflow_dispatch:

# Prevent concurrent builds per ref (avoid cache races).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# GITHUB_TOKEN needs contents:write to create releases and upload assets.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            artifact_ext: zip
            archive_name: macos-arm64
            toolchain_cache_path: /Users/runner/.mozbuild
            target: native
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact_ext: tar.xz
            archive_name: linux-x86_64
            toolchain_cache_path: /home/runner/.mozbuild
            target: native
          # Windows is built natively on the windows-2022 image. It ships
          # Visual Studio 2022 (17.14) + Windows SDK 10.0.26100 — exactly what
          # mozbuild asks for — so no multi-GB SDK download is needed at build
          # time. (The old cross-compile on Linux had to fetch the VS sysroot +
          # Win11SDK into ~/.mozbuild via --enable-bootstrap, which is what made
          # that job time out.) The image tag is pinned rather than
          # `windows-latest` because `-latest` is being migrated to Windows
          # Server 2025 (VS 2026) and we want a predictable toolset.
          # MozillaBuild is installed in a dedicated step below, because mach
          # hard-fails without it on Windows
          # (see build/mach_initialize.py:_maybe_activate_mozillabuild_environment).
          - name: Windows x86_64
            os: windows-2022
            artifact_ext: zip
            archive_name: windows-x86_64
            toolchain_cache_path: C:\Users\runneradmin\.mozbuild
            target: native

    steps:
      # ── 1. Checkout ──
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Free disk space ──
      # Remove pre-installed toolchains that GitHub runners include but we
      # don't need. This reclaims ~20 GB on Linux, which the build output
      # needs.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          df -h /
          echo "Removing unused toolchains and caches..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h /

      - name: Free disk space (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf ~/Library/Caches/Homebrew/*
          rm -rf ~/Library/Caches/pip
          df -h /

      # ── 3. Install macOS system dependencies ──
      # mach bootstrap --no-system-changes skips Homebrew installs, so we
      # pre-install the packages Firefox needs.
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install nasm yasm watchman pkg-config || true

      # ── 4. Install Linux system dependencies ──
      # Firefox on Linux needs GTK, X11, GL, and various multimedia libs.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-setuptools \
            wget curl unzip zip \
            pkg-config autoconf2.13 \
            libgtk-3-dev libglib2.0-dev libxt-dev \
            libasound2-dev libpulse-dev \
            libdbus-glib-1-dev \
            libx11-xcb-dev libxcomposite-dev libxdamage-dev libxrandr-dev \
            libxss-dev libxcursor-dev libxinerama-dev \
            libpango1.0-dev libcairo2-dev \
            libfreetype6-dev libfontconfig1-dev \
            libavcodec-dev libavutil-dev libvpx-dev \
            nasm yasm \
            libssl-dev libsqlite3-dev \
            libnotify-dev libxtst-dev \
            libgl1-mesa-dev libgles2-mesa-dev \
            build-essential

      # ── 4b. Install MozillaBuild (Windows only) ──
      # mach requires a MozillaBuild install on Windows and asserts that
      # C:\mozilla-build exists (build/mach_initialize.py). The official
      # unattended install is `/S` with the default target directory, which
      # is what Mozilla's own release SRE does on its Windows workers.
      # Visual Studio 2022 + the Windows SDK are already on the runner, so
      # nothing else needs downloading.
      - name: Install MozillaBuild (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe'
          $exe = Join-Path $env:TEMP 'MozillaBuildSetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList '/S' -Wait
          if (-not (Test-Path 'C:\mozilla-build\msys2\usr\bin')) {
            throw 'MozillaBuild did not install to C:\mozilla-build as expected'
          }
          Write-Host "MozillaBuild installed:"
          Get-Content 'C:\mozilla-build\VERSION' -ErrorAction SilentlyContinue

      # ── 5. Add Rust target (Windows native) ──
      # The Windows build needs the MSVC host target; it is normally the
      # rustup default, but make it explicit so a missing component fails
      # here rather than deep inside configure.
      - name: Add Rust target (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup target list --installed
          rustc --version

      # ── 5b. Pin the Rust toolchain (Linux) ──
      # v0.6.9-beta died at configure with:
      #   "Don't know how to translate x86_64-pc-linux-gnu for rustc"
      # (build/moz.configure/rust.configure:423) — the rustc taken from the
      # runner image offered no linux candidate in `rustc --print target-list`,
      # so mozbuild gave up. Pin an explicit stable toolchain instead of
      # trusting whatever the floating runner image ships.
      - name: Ensure Rust toolchain (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update || true
          rustup default stable
          echo "--- rustc ---"
          rustc --version
          echo "--- x86_64 linux targets in rustc target list ---"
          rustc --print target-list | grep -E "^x86_64-(unknown|pc)-linux" \
            || echo "WARNING: rustc exposes no x86_64 linux target"

      # ── 6. Restore toolchain cache (~/.mozbuild, ~5-10 GB) ──
      - name: Restore toolchain cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.toolchain_cache_path }}
          key: mozbuild-${{ matrix.archive_name }}-${{ hashFiles('mozconfig', 'python/mozboot/**') }}
          restore-keys: |
            mozbuild-${{ matrix.archive_name }}-

      # ── 7. Restore sccache ──
      - name: Restore sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ matrix.archive_name }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ matrix.archive_name }}-

      # ── 8. Create mozconfig ──
      # All three platforms build natively now, so the config is nearly
      # uniform. (The Windows job used to cross-compile from Linux and needed
      # --target=x86_64-pc-windows-msvc plus --enable-bootstrap to download the
      # VS sysroot + Windows SDK into ~/.mozbuild.)
      # Windows omits sccache: the windows-2022 runner image does not ship the
      # sccache binary, and `--with-ccache=sccache` would fail configure.
      - name: Create mozconfig (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cat > mozconfig << 'EOF'
          ac_add_options --enable-application=browser
          ac_add_options --disable-debug
          ac_add_options --enable-optimize
          ac_add_options --disable-tests
          ac_add_options --with-ccache=sccache
          EOF
          echo "--- mozconfig ---"
          cat mozconfig

      - name: Create mozconfig (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cat > mozconfig << 'EOF'
          ac_add_options --enable-application=browser
          ac_add_options --disable-debug
          ac_add_options --enable-optimize
          ac_add_options --disable-tests
          EOF
          echo "--- mozconfig ---"
          cat mozconfig

      # ── 9. Make mach executable ──
      - name: Make mach executable
        shell: bash
        run: chmod +x ./mach

      # ── 10. Bootstrap dependencies ──
      # Downloads and installs all toolchains (Clang, Rust, Node, etc.) into
      # ~/.mozbuild. On cache hit: verifies everything is present (~2 min).
      # On cache miss: downloads and installs (~10-20 min).
      - name: Bootstrap dependencies
        shell: bash
        run: |
          ./mach bootstrap --application-choice=browser --no-system-changes

      # ── 11. Build ──
      # sccache is only used on macOS/Linux (see the mozconfig steps), so the
      # stats calls are guarded rather than unconditional.
      - name: Build Firefox
        shell: bash
        env:
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        run: |
          if command -v sccache >/dev/null 2>&1; then sccache --show-stats || true; fi
          ./mach build
          if command -v sccache >/dev/null 2>&1; then sccache --show-stats || true; fi

      # ── 12. Package ──
      - name: Package Firefox
        shell: bash
        run: |
          ./mach package

      # ── 13. Create distributable archive ──
      - name: Create distributable archive (macOS)
        if: runner.os == 'macOS'
        id: archive-macos
        shell: bash
        run: |
          APP_PATH=$(find obj-*/dist -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found in obj-*/dist/"
            ls -la obj-*/dist/ || true
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          ARCHIVE_NAME="Firefox-Fingerprint-Customizer-${{ github.ref_name }}-${{ matrix.archive_name }}.zip"
          rm -f "$ARCHIVE_NAME"
          ditto -c -k --keepParent "$APP_PATH" "$ARCHIVE_NAME"
          echo "Created: $ARCHIVE_NAME"
          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "artifact_path=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256sum"
          echo "Checksum:"
          cat "$ARCHIVE_NAME.sha256sum"

      - name: Create distributable archive (Linux)
        if: runner.os == 'Linux'
        id: archive-linux
        shell: bash
        run: |
          TARBALL=$(find obj-*/dist -maxdepth 1 -type f \( -name "*.tar.bz2" -o -name "*.tar.xz" \) 2>/dev/null | head -1)
          if [ -z "$TARBALL" ]; then
            echo "ERROR: No .tar.bz2 or .tar.xz found in obj-*/dist/"
            ls -la obj-*/dist/ || true
            exit 1
          fi
          echo "Found tarball: $TARBALL"
          EXT="${TARBALL##*.}"
          ARCHIVE_NAME="Firefox-Fingerprint-Customizer-${{ github.ref_name }}-${{ matrix.archive_name }}.tar.$EXT"
          cp "$TARBALL" "$ARCHIVE_NAME"
          echo "Created: $ARCHIVE_NAME"
          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "artifact_path=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256sum"
          echo "Checksum:"
          cat "$ARCHIVE_NAME.sha256sum"

      - name: Create distributable archive (Windows)
        if: runner.os == 'Windows'
        id: archive-windows
        shell: bash
        run: |
          # MozillaBuild's MSYS2 supplies unzip/sha256sum/etc. — the git-bash
          # that GitHub provides on Windows does not ship unzip, which the
          # firefox.exe sanity check below needs.
          export PATH="/c/mozilla-build/msys2/usr/bin:$PATH"

          # The Windows build produces the full package in
          # obj-x86_64-pc-windows-msvc/dist/. `mach package` also emits
          # intermediate artifacts (e.g. *.xpt_artifacts.zip) that MUST NOT be
          # published — a naive `find -name "*.zip" | head -1` picks the wrong
          # file. Instead:
          #   1. Prefer dist/package_name.txt, which `mach package` writes with
          #      the real package filename (firefox-<ver>.<locale>.<platform>.zip).
          #   2. Fall back to matching the full Firefox package name explicitly,
          #      excluding xpt_artifacts / symbols / tests intermediates.
          #   3. Sanity-check the archive actually contains firefox.exe.
          # NOTE: use `find obj-*/dist` (shell expands the glob) — `find . -path`
          # would yield "./obj-*/dist" paths that never match a bare "obj-*/dist"
          # pattern, so DIST_DIR would end up empty and the step would fail.
          DIST_DIR=$(find obj-*/dist -maxdepth 0 -type d 2>/dev/null | head -1)
          if [ -z "$DIST_DIR" ]; then
            echo "ERROR: No obj-*/dist directory found"
            ls -la . || true
            exit 1
          fi
          echo "Dist dir: $DIST_DIR"

          ZIPFILE=""
          # Preferred: read the package name recorded by `mach package`
          if [ -f "$DIST_DIR/package_name.txt" ]; then
            PKG_NAME=$(tr -d '[:space:]' < "$DIST_DIR/package_name.txt")
            if [ -n "$PKG_NAME" ] && [ -f "$DIST_DIR/$PKG_NAME" ]; then
              ZIPFILE="$DIST_DIR/$PKG_NAME"
              echo "Using package_name.txt: $PKG_NAME"
            fi
          fi

          # Fallback: explicit full-package match, no intermediates
          if [ -z "$ZIPFILE" ]; then
            ZIPFILE=$(find "$DIST_DIR" -maxdepth 1 -type f \
              \( -name "firefox-*.zip" -o -name "*.win64.zip" -o -name "*.win32.zip" \) \
              ! -name "*xpt_artifacts*" \
              ! -name "*crashreporter-symbols*" \
              ! -name "*mozharness*" \
              ! -name "*tests*" \
              2>/dev/null | head -1)
          fi

          if [ -z "$ZIPFILE" ] || [ ! -f "$ZIPFILE" ]; then
            echo "ERROR: No full Firefox package zip found in $DIST_DIR/"
            echo "Contents of $DIST_DIR/:"
            ls -la "$DIST_DIR/" || true
            exit 1
          fi

          # Sanity check: a real Windows build contains firefox.exe,
          # not just .xpt typelib files.
          if ! unzip -l "$ZIPFILE" 2>/dev/null | grep -q "firefox.exe"; then
            echo "ERROR: $ZIPFILE does not contain firefox.exe — refusing to publish an incomplete package."
            unzip -l "$ZIPFILE" 2>/dev/null | head -20 || true
            exit 1
          fi

          echo "Found zip: $ZIPFILE"
          ARCHIVE_NAME="Firefox-Fingerprint-Customizer-${{ github.ref_name }}-${{ matrix.archive_name }}.zip"
          rm -f "$ARCHIVE_NAME"
          cp "$ZIPFILE" "$ARCHIVE_NAME"
          echo "Created: $ARCHIVE_NAME"
          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "artifact_path=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256sum"
          echo "Checksum:"
          cat "$ARCHIVE_NAME.sha256sum"

      # ── 14. Upload as workflow artifact ──
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive-macos.outputs.archive_name || steps.archive-linux.outputs.archive_name || steps.archive-windows.outputs.archive_name }}
          path: |
            ${{ steps.archive-macos.outputs.archive_name || steps.archive-linux.outputs.archive_name || steps.archive-windows.outputs.archive_name }}
            ${{ steps.archive-macos.outputs.archive_name || steps.archive-linux.outputs.archive_name || steps.archive-windows.outputs.archive_name }}.sha256sum
          retention-days: 90

      # ── 15. sccache stats (always, for debugging) ──
      - name: sccache stats
        if: always()
        shell: bash
        env:
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          else
            echo "sccache is not installed on this platform (Windows) — skipping"
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Release job: runs after all build jobs succeed. Downloads every platform
  # artifact and attaches them to a single GitHub Release on the tag.
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: List artifacts
        shell: bash
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f | sort
          echo "---"
          echo "Files to release:"
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.bz2" -o -name "*.tar.xz" -o -name "*.sha256sum" \) | sort

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.bz2" -o -name "*.tar.xz" \) -exec cp {} release-files/ \;
          cat artifacts/*/*.sha256sum | sort > release-files/SHA256SUMS.txt
          echo "--- Release files ---"
          ls -la release-files/
          echo "--- SHA256SUMS.txt ---"
          cat release-files/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            > **Beta pre-release.** This build is usable but still buggy, and is
            > deliberately not published as an official release — please report
            > problems on the issue tracker.

            ### Download

            **macOS** — Apple Silicon (M-series)
            - `Firefox-Fingerprint-Customizer-${{ github.ref_name }}-macos-arm64.zip` — unzip, then drag the app to Applications
            - Intel Macs: no prebuilt binary, build from source instead (see the README)

            **Windows** — x86_64
            - `Firefox-Fingerprint-Customizer-${{ github.ref_name }}-windows-x86_64.zip` — unzip, then run `firefox.exe`

            **Linux** — x86_64
            - `Firefox-Fingerprint-Customizer-${{ github.ref_name }}-linux-x86_64.tar.xz` — extract, then run `./firefox`

            **Checksums** — `SHA256SUMS.txt` (covers every file above)

            ### Verify (optional)

            ```bash
            # macOS / Linux
            shasum -a 256 -c SHA256SUMS.txt
            # every file should report: OK

            # Windows (PowerShell)
            Get-FileHash Firefox-Fingerprint-Customizer-${{ github.ref_name }}-windows-x86_64.zip -Algorithm SHA256
            # then compare it with the matching line in SHA256SUMS.txt
            ```

            ### Build info

            GitHub Actions · commit `${{ github.sha }}` · ${{ github.run_started_at }}
            Each platform is built natively on its own runner.
          files: |
            release-files/*
          draft: false
          # Releases stay pre-releases: every tag carries a -beta suffix, and the
          # build is intentionally not presented as an official release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Append the auto-generated "What's Changed" section after the body.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

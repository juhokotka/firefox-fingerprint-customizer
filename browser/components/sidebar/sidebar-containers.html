<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src resource: chrome:; object-src 'none'; img-src data: chrome:;"
    />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="sidebar-containers-title"></title>
    <link rel="localization" href="browser/containersSidebar.ftl" />
    <link
      rel="stylesheet"
      href="chrome://browser/content/sidebar/sidebar.css"
    />
    <link
      rel="stylesheet"
      href="chrome://browser/content/sidebar/sidebar-containers.css"
    />
    <script
      type="module"
      src="chrome://browser/content/sidebar/sidebar-panel-header.mjs"
    ></script>
    <script src="chrome://browser/content/contentTheme.js"></script>
    <script
      type="module"
      src="chrome://browser/content/sidebar/sidebar-containers.mjs"
    ></script>
  </head>

  <body>
    <div class="sidebar-panel">
      <sidebar-panel-header
        data-l10n-id="sidebar-menu-containers-header"
        data-l10n-attrs="heading"
        view="viewContainersSidebar"
      ></sidebar-panel-header>
      <div class="sidebar-panel-scrollable-content">
        <div id="containers-list"></div>
        <div id="containers-empty" hidden data-l10n-id="sidebar-containers-empty"></div>
      </div>
      <moz-button
        id="new-container-btn"
        type="primary"
        data-l10n-id="sidebar-containers-new"
      ></moz-button>
    </div>
  </body>
</html>
